<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport">
  <meta content="web_standard" name="shell-type">
  <title>Campus Findr • Official State University Lost &amp; Found Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-variant": "#d5e3fc",
            "primary-fixed": "#dbe1ff",
            "outline-variant": "#c3c6d7",
            "surface-container-lowest": "#ffffff",
            "secondary": "#904d00",
            "on-tertiary-fixed-variant": "#005137",
            "surface-container-low": "#eff4ff",
            "on-background": "#0d1c2e",
            "error-container": "#ffdad6",
            "on-primary-container": "#eeefff",
            "on-error-container": "#93000a",
            "on-secondary": "#ffffff",
            "on-tertiary": "#ffffff",
            "on-surface": "#0d1c2e",
            "on-primary-fixed-variant": "#003ea8",
            "inverse-surface": "#233144",
            "inverse-on-surface": "#eaf1ff",
            "tertiary-fixed": "#85f8c4",
            "on-surface-variant": "#434655",
            "tertiary": "#006243",
            "on-tertiary-container": "#bdffdc",
            "secondary-fixed-dim": "#ffb77d",
            "surface-tint": "#0053db",
            "primary": "#004ac6",
            "surface-container-high": "#dce9ff",
            "error": "#ba1a1a",
            "surface-bright": "#f8f9ff",
            "on-secondary-container": "#663500",
            "tertiary-fixed-dim": "#68dba9",
            "secondary-container": "#fe932c",
            "on-secondary-fixed": "#2f1500",
            "inverse-primary": "#b4c5ff",
            "on-primary-fixed": "#00174b",
            "background": "#f8f9ff",
            "on-primary": "#ffffff",
            "surface-dim": "#ccdbf3",
            "on-tertiary-fixed": "#002114",
            "surface-container-highest": "#d5e3fc",
            "on-error": "#ffffff",
            "surface-container": "#e6eeff",
            "on-secondary-fixed-variant": "#6e3900",
            "secondary-fixed": "#ffdcc3",
            "primary-fixed-dim": "#b4c5ff",
            "tertiary-container": "#007d57",
            "surface": "#f8f9ff",
            "outline": "#737686",
            "primary-container": "#2563eb"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          spacing: {
            "space-xl": "2rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-sm": "0.5rem",
            "gutter": "1rem",
            "margin-tablet": "1.5rem",
            "gutter-desktop": "1.5rem",
            "margin-desktop": "2rem",
            "space-xs": "0.25rem",
            "margin": "1rem"
          },
          fontFamily: {
            "label-sm": ["Inter", "sans-serif"],
            "label-lg": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "headline-xl": ["Plus Jakarta Sans", "sans-serif"],
            "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "headline-xl-mobile": ["Plus Jakarta Sans", "sans-serif"]
          },
          fontSize: {
            "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-xl-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed-variant">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
